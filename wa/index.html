*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {

font-weight: 500;
line-height: 1.7;
color: #d1d5db;

.sub strong { color: #fff; font-weight: 700; }
.wa-btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 12px;
background: var(--wa);
color: #fff;
font-family: 'Montserrat', sans-serif;
font-size: clamp(16px, 2.4vw, 21px);
font-weight: 800;
padding: 20px 40px;
border-radius: 10px;
text-decoration: none;
border: none;
cursor: pointer;
width: 100%;
max-width: 460px;
transition: background 0.2s, transform 0.15s;
animation: pulse 1.6s ease-in-out infinite;
}
.wa-btn:hover { background: var(--wa-dark); animation: none; transform: translateY(-2px); }
.wa-btn svg { width: 26px; height: 26px; fill: #fff; flex-shrink: 0; }
@keyframes pulse {
0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,211,102,0.5); }
50% { transform: scale(1.02); box-shadow: 0 0 0 14px rgba(37,211,102,0); }
}
.wa-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
.wa-avatar-wrap { position: relative; width: 110px; height: 110px; margin-bottom: 10px; }
.wa-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--wa); }
.wa-online { position: absolute; bottom: 6px; right: 6px; width: 20px; height: 20px; background: var(--wa); border: 3px solid #0a0a0a; border-radius: 50%; }
.wa-name { font-size: clamp(18px, 2.6vw, 22px); font-weight: 800; color: #fff; }
.wa-status { font-size: clamp(12px, 1.6vw, 14px); font-weight: 500; color: var(--wa); margin-top: 2px; }
.reassure {
margin-top: 18px;
font-size: clamp(12px, 1.6vw, 14px);
color: #6b7280;
font-weight: 500;
}
.logo {
font-size: clamp(20px, 3vw, 26px);
font-weight: 900;
letter-spacing: 0.04em;
margin-bottom: 32px;
color: #fff;
}
.logo .zero { color: var(--green); }
