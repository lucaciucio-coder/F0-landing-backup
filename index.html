<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula 0 — Sistema Multi Affiliate</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #16a34a;
      --green-dark: #15803d;
      --black: #0a0a0a;
      --white: #ffffff;
      --gray: #f5f5f5;
    }

    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* TIMER */
    .timer-bar {
      background: var(--white);
      border-bottom: 1px solid #e5e5e5;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .timer-bar p {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      font-family: 'Montserrat', sans-serif;
    }

    .timer-digits {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 8px 16px;
    }

    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 40px;
    }

    .timer-unit span:first-child {
      font-size: 20px;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
      line-height: 1;
    }

    .timer-unit span:last-child {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #999;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .timer-sep {
      font-size: 20px;
      font-weight: 800;
      color: #ccc;
      margin-bottom: 12px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 48px 20px 32px;
      max-width: 860px;
      margin: 0 auto;
    }

    .hero .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 500;
      color: #555;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(26px, 4.5vw, 48px);
      font-weight: 900;
      line-height: 1.15;
      color: var(--black);
      margin-bottom: 16px;
    }

    .hero h1 .green { color: var(--green); }

    .hero .subhead {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      line-height: 1.4;
      color: var(--black);
      margin-bottom: 8px;
    }

    .hero .subhead .green { color: var(--green); }

    .hero .tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 700;
      color: var(--black);
      margin-top: 8px;
    }

    /* VIDEO */
    .video-wrap {
      max-width: 860px;
      margin: 28px auto 0;
      padding: 0 20px;
      position: relative;
    }
